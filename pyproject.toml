[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gdpr-security-mapper"
version = "1.0.0"
description = "Maps security configurations to GDPR compliance articles with CLI and Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abosede-o-Makinde", email = "abomaabidemi27@gmail.com" }]
keywords = ["gdpr", "security", "compliance", "uk-gdpr", "data-protection"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.0",
    "streamlit>=1.30",
    "plotly>=5.18",
    "pandas>=2.1",
    "reportlab>=4.0",
    "Pillow>=10.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "types-PyYAML>=6.0",
]

[project.scripts]
gdpr-mapper = "gdpr_mapper.cli:cli"

[project.urls]
Repository = "https://github.com/Abosede-o-Makinde/gdpr-security-mapper"
Issues = "https://github.com/Abosede-o-Makinde/gdpr-security-mapper/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=gdpr_mapper --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["gdpr_mapper"]

[tool.coverage.run]
omit = ["tests/*", "gdpr_mapper/app.py"]
