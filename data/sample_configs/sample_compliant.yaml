# Sample: Well-secured system — expected overall score ~90%+
# Represents a mature production environment with strong controls.

system:
  name: "Customer Data Platform - Production"
  description: "Cloud-hosted customer data platform on Azure UK South"
  environment: production
  data_classification: personal
  contains_special_category: false
  data_subjects_count: 45000
  processing_activities:
    - "User authentication and session management"
    - "Customer order and transaction processing"
    - "Analytics (aggregated, pseudonymised)"

firewall:
  default_ingress: deny
  default_egress: allow
  network_segmentation: true
  zones: [dmz, application, database, management]
  rules:
    - name: "Allow HTTPS from internet"
      protocol: TCP
      port: "443"
      source: "0.0.0.0/0"
      action: allow
      direction: inbound
    - name: "Allow HTTP redirect"
      protocol: TCP
      port: "80"
      source: "0.0.0.0/0"
      action: allow
      direction: inbound
    - name: "Allow SSH from management VNET only"
      protocol: TCP
      port: "22"
      source: "10.0.0.0/24"
      action: allow
      direction: inbound
    - name: "Deny all other inbound"
      protocol: "*"
      port: "*"
      source: "*"
      action: deny
      direction: inbound

encryption:
  at_rest:
    enabled: true
    algorithm: "AES-256"
    key_management: hsm
    covers: [database, storage, backups, logs]
  in_transit:
    tls_version: "1.3"
    tls_12_minimum: true
    hsts: true
    certificate_valid: true
    internal_tls: true
  key_rotation:
    enabled: true
    period_days: 90

access_control:
  mfa:
    enabled: true
    applies_to: all
  privileged_access:
    pam_solution: true
    just_in_time: true
    break_glass_documented: true
  rbac:
    enabled: true
    principle_least_privilege: true
    regular_review: true
    review_frequency_days: 90
  service_accounts:
    inventory_maintained: true
    no_interactive_login: true
    secrets_managed: true
  admin_access:
    wildcard_admin_restricted: true
    default_admin_disabled: true

logging:
  audit_logging:
    enabled: true
    covers:
      - authentication
      - authorization
      - data_access
      - admin_actions
      - configuration_changes
  retention:
    period_days: 365
    immutable: true
  centralized: true
  siem_integration: true
  alerting:
    enabled: true
    breach_detection_rules: true
    anomaly_detection: true

incident_response:
  plan_documented: true
  last_tested: "2026-03-15"
  breach_notification_72h: true
  data_breach_register: true
  dpo_contact_documented: true

data_protection:
  pseudonymisation: true
  anonymisation: false
  data_minimisation_enforced: true
  retention_policy_documented: true
  deletion_capability: true

backups:
  enabled: true
  frequency: daily
  offsite: true
  tested: true
  test_frequency: "quarterly"
  encrypted: true

vulnerability_management:
  scanning:
    enabled: true
    frequency: weekly
    last_scan: "2026-06-10"
  patching:
    policy_documented: true
    critical_patch_sla_days: 14
  penetration_testing:
    conducted: true
    frequency: annual
    last_test: "2026-02-20"

dpia:
  required: true
  completed: true
  completion_date: "2026-01-10"
  dpo_sign_off: true
  review_schedule: annual

international_transfers:
  transfers_to_third_countries: false
  transfer_mechanisms: []
  data_residency:
    region: "UK South / UK West"
    documented: true

third_party_processors:
  inventory_maintained: true
  dpas_signed: true
  regular_review: true

privacy:
  notice_published: true
  notice_url: "https://example.gov.uk/privacy"
  notice_last_updated: "2026-03-01"
  lawful_bases_documented: true
  purpose_limitation_enforced: true
  cookie_consent_mechanism: true
  subject_rights_process_documented: true

data_retention:
  policy_documented: true
  maximum_retention_defined: true
  automated_deletion: true
  deletion_audit_trail: true
  erasure_requests:
    process_documented: true
    sla_days: 20
    verified_deletion: true
    automated_processing: true
